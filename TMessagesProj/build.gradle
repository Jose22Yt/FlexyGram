import java.nio.file.Paths
import org.gradle.internal.os.OperatingSystem

plugins {
    id 'com.android.application'
    // Google Services processing is reserved for P0.3; no inherited Firebase config.

    id 'com.chaquo.python'
    id 'org.telegram.lottie-meta'
    id 'idea'
}

idea {
    module {
        excludeDirs += [
            file('jni/third_party'),
            file('jni/ffmpeg'),
            file('jni/tlottie'),
            file('jni/boringssl'),
            file('jni/sqlite')
        ]
    }
}

def buildTimestamp = System.getenv('BUILD_TIMESTAMP') ?: '0'
def commitId = System.getenv('COMMIT_ID')
def shortCommit = commitId?.take(7) ?: ''
def verName = "${APP_VERSION_NAME}${shortCommit ? "-${shortCommit}" : ''}"
def verCode = 1261

def officialVer = APP_VERSION_NAME
def officialCode = APP_VERSION_CODE

// SDK/build-Python settings only. Diagnostic never resolves private service credentials.
Properties properties = new Properties()
if (rootProject.file('local.properties').exists()) {
    rootProject.file('local.properties').withInputStream { properties.load(it) }
}
def variantPolicyFile = rootProject.file('gradle/variant-policy.json')
def variantPolicy = new GroovyShell().evaluate(rootProject.file('gradle/variant-policy.gradle')).call(variantPolicyFile)
def policyDigest = java.security.MessageDigest.getInstance('SHA-256').digest(variantPolicyFile.bytes).encodeHex().toString()
// Separate offline development profile; never rewrites the protected two-variant policy.
def betaDevelopmentEnabled = providers.gradleProperty('flexygramBetaDevelopment').orNull == 'true'
def betaPolicyFile = rootProject.file('gradle/beta-development.json')
def betaPolicy = betaDevelopmentEnabled ? new GroovyShell().evaluate(rootProject.file('gradle/beta-development.gradle')).call(betaPolicyFile) : null
def betaScope = betaDevelopmentEnabled ? java.security.MessageDigest.getInstance('SHA-256').digest(betaPolicyFile.bytes).encodeHex().toString() + ':betaDevelopment' : null
if (betaDevelopmentEnabled && System.getenv('NATIVE_TARGET') != 'arm64-v8a') {
    throw new GradleException('FLEXYGRAM_BETA_REQUIRES_REAL_ARM64_JNI')
}
// Native-interface integration has a separate closed profile; no credentials are resolved.
def realAlphaEnabled = providers.gradleProperty('flexygramRealAlpha').orNull == 'true'
def localLoginPagesEnabled = providers.gradleProperty('flexygramLocalLoginPages').orNull == 'true'
if (localLoginPagesEnabled && !realAlphaEnabled) throw new GradleException('FLEXYGRAM_LOCAL_PAGES_REQUIRES_REALALPHA')
if (localLoginPagesEnabled && !rootProject.file('build/generated/flexygram-local-login/java/org/telegram/ui/LoginActivity.java').isFile()) throw new GradleException('FLEXYGRAM_LOCAL_PAGES_OVERLAY_REQUIRED')
if (localLoginPagesEnabled) { def expected = new groovy.json.JsonSlurper().parse(rootProject.file('patches/native-login-pages/inventory.json')).overlay_sha256; def actual = java.security.MessageDigest.getInstance('SHA-256').digest(rootProject.file('build/generated/flexygram-local-login/java/org/telegram/ui/LoginActivity.java').bytes).encodeHex().toString(); if (actual != expected) throw new GradleException('FLEXYGRAM_LOCAL_PAGES_OVERLAY_MISMATCH') }

if (localLoginPagesEnabled) {
    def expected = new groovy.json.JsonSlurper().parse(rootProject.file('tools/real_alpha_local_login/generated.json'))
    expected.each { path, digest ->
        def source = rootProject.file('build/generated/flexygram-local-login/realAlpha/' + path)
        if (!source.isFile() || java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString() != digest)
            throw new GradleException('FLEXYGRAM_LOCAL_LOGIN_REALALPHA_SOURCE_REQUIRED')
    }
}
def realAlphaPolicyFile = rootProject.file('gradle/real-alpha.json')
def realAlphaPolicy = realAlphaEnabled ? new GroovyShell().evaluate(rootProject.file('gradle/real-alpha.gradle')).call(realAlphaPolicyFile) : null
def realAlphaScope = realAlphaEnabled ? java.security.MessageDigest.getInstance('SHA-256').digest(realAlphaPolicyFile.bytes).encodeHex().toString() + ':realAlpha' : null
if (realAlphaEnabled && System.getenv('NATIVE_TARGET') != 'arm64-v8a') {
    throw new GradleException('FLEXYGRAM_REAL_ALPHA_REQUIRES_REAL_ARM64_JNI')
}
def startupDiagnosticsEnabled = providers.gradleProperty('flexygramRealAlphaStartupDiagnostics').orNull == 'true'
if (localLoginPagesEnabled && startupDiagnosticsEnabled) throw new GradleException('FLEXYGRAM_LOCAL_LOGIN_STARTUP_OVERLAY_NOT_REVIEWED')
if (startupDiagnosticsEnabled && !realAlphaEnabled) {
    throw new GradleException('FLEXYGRAM_STARTUP_DIAGNOSTICS_REQUIRES_REAL_ALPHA')
}
def rejectProduction = new GroovyShell().evaluate(rootProject.file('gradle/production-readiness.gradle'))
// Early, redacted rejection even for tasks of variants which AGP deliberately disables.
if (gradle.startParameter.taskNames.any { it.toLowerCase(java.util.Locale.ROOT).contains('production') }) {
    rejectProduction.call()
}
def resolvePush = new GroovyShell().evaluate(rootProject.file('gradle/push-services.gradle'))
def pushConfig = resolvePush(new Properties(), [:], variantPolicy.diagnostic.applicationId, true)
def chaquopyBuildPython = properties.getProperty('CHAQUOPY_BUILD_PYTHON') ?: System.getenv('CHAQUOPY_BUILD_PYTHON')

def nativeTarget = System.getenv('NATIVE_TARGET') ?: ''

if (nativeTarget == 'SKIP') {
    tasks.configureEach { task ->
        if (
            task.name.toLowerCase().contains('cmake') ||
            task.name.toLowerCase().contains('jni') ||
            task.name.toLowerCase().contains('test')
        ) {
            task.enabled = false
        }
    }
}

android {
    // IDs are fixed per flavor, not an overridable project-wide APP_PACKAGE.
    flavorDimensions += 'environment'
    buildFeatures { resValues = true }

    androidResources {
        localeFilters += [
                'en', 'ar', 'de', 'es', 'es-rES', 'fa-rIR', 'in-rID', 'it', 'it-rIT', 'ja-rJP',
                'ko', 'nl', 'pl-rPL', 'pt-rBR', 'ru-rRU', 'tr-rTR', 'uk-rUA', 'vi-rVN', 'zh-rCN', 'zh-rTW'
        ]
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Целевые ABI. Ограничение живёт в ndk.abiFilters — этого требует Chaquopy;
    // см. комментарий у splits ниже.
    // 32-битных ABI в списке нет намеренно: Chaquopy собирает Python 3.12 только
    // под arm64-v8a и x86_64, и на armeabi-v7a конфигурация падает ещё до сборки
    // («Python 3.12 is not available for the ABI»). Вернуть их можно только вместе
    // с откатом Python до 3.11 — тогда та же минорная версия понадобится и на
    // машине сборки, включая CI.
    def targetAbis
    if (nativeTarget == 'universal') {
        targetAbis = ['arm64-v8a', 'x86_64']
    } else if (nativeTarget == 'SKIP') {
        targetAbis = ['arm64-v8a']
    } else if (!nativeTarget.isBlank()) {
        targetAbis = [nativeTarget]
    } else {
        targetAbis = ['arm64-v8a', 'x86_64']
    }

    // splits.abi выключен намеренно, а не по недосмотру. Два ограничения
    // несовместимы, оба проверены на этом дереве:
    //   * без ndk.abiFilters Chaquopy падает на конфигурации
    //     («Chaquopy requires ndk.abiFilters»);
    //   * с abiFilters AGP отвергает splits.abi.include
    //     («Conflicting configuration ... cannot be present when splits abi
    //     filters are set»).
    // Поэтому раздельные APK получаются не сплитами, а отдельной сборкой на
    // каждый ABI: NATIVE_TARGET=arm64-v8a, затем NATIVE_TARGET=x86_64.
    // Пустой NATIVE_TARGET даёт ОДИН APK с обоими ABI (~+51 МБ на второй
    // libtmessages.so) — о чём ниже предупреждение в лог.
    splits {
        abi {
            enable = false
        }
    }

    if (targetAbis.size() > 1 && nativeTarget != 'universal') {
        logger.warn("NATIVE_TARGET не задан: собирается ОДИН APK с ABI " +
                targetAbis.join(', ') + ". Раздельные APK — по одной сборке на ABI " +
                "(splits.abi несовместим с Chaquopy).")
    }

    defaultConfig {
        versionName verName
        versionCode verCode

        // Python plugin engine (Chaquopy). ABI restriction is here (not in splits).
        ndk {
            abiFilters(*targetAbis)
        }

        python {
            version '3.11'
            if (chaquopyBuildPython != null && !chaquopyBuildPython.isBlank()) {
                buildPython chaquopyBuildPython
            }
            pip {
                options '--require-hashes', '--only-binary', ':all:', '--no-index', '--find-links', file('build/locked-wheelhouse').absolutePath
                install '-r', file('python/requirements.lock').absolutePath
            }
        }

        // All service values remain empty/disabled until a separately reviewed implementation.
        def appId = '0'
        def appHash = ''
        def mapsKey = ''
        def glyphKey = ''
        buildConfigField 'boolean', 'FLEXYGRAM_FCM_ENABLED', pushConfig.fcm.toString()
        buildConfigField 'boolean', 'FLEXYGRAM_UNIFIED_PUSH_ENABLED', pushConfig.unified.toString()
        buildConfigField 'String', 'FLEXYGRAM_PUSH_ANDROID_ID', groovy.json.JsonOutput.toJson(pushConfig.androidId)
        buildConfigField 'String', 'FLEXYGRAM_FCM_PROJECT_ID', groovy.json.JsonOutput.toJson(pushConfig.projectId)
        buildConfigField 'String', 'FLEXYGRAM_FCM_APP_ID', groovy.json.JsonOutput.toJson(pushConfig.appId)
        buildConfigField 'String', 'FLEXYGRAM_FCM_SENDER_ID', groovy.json.JsonOutput.toJson(pushConfig.senderId)
        buildConfigField 'String', 'FLEXYGRAM_FCM_API_KEY', groovy.json.JsonOutput.toJson(pushConfig.apiKey)
        buildConfigField 'String', 'FLEXYGRAM_UNIFIED_GATEWAY', groovy.json.JsonOutput.toJson(pushConfig.gateway)
        buildConfigField 'String', 'FLEXYGRAM_UNIFIED_DISTRIBUTOR', groovy.json.JsonOutput.toJson(pushConfig.distributor)
        buildConfigField 'String', 'FLEXYGRAM_PUSH_SCOPE', groovy.json.JsonOutput.toJson(pushConfig.scope)

        manifestPlaceholders += [MAPS_API_KEY: mapsKey, GLYPH_API_KEY: glyphKey]

        buildConfigField 'String', 'BUILD_VERSION_STRING', '"' + APP_VERSION_NAME + '"'
        buildConfigField 'String', 'BUILD_COMMIT_ID', '"' + shortCommit + '"'
        buildConfigField 'String', 'OFFICIAL_VERSION', '"' + officialVer + '"'
        buildConfigField 'int', 'OFFICIAL_VERSION_CODE', officialCode + ''
        buildConfigField 'int', 'APP_ID', appId
        buildConfigField 'String', 'APP_HASH', '"' + appHash + '"'
        buildConfigField 'long', 'BUILD_TIMESTAMP', buildTimestamp + 'L'
        buildConfigField 'boolean', 'DEBUG_TOOLS', String.valueOf(project.findProperty('debugTools') == 'true')

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-24', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                System.getenv('PATH').split(File.pathSeparator).any { path ->
                    var file = Paths.get("${path}${File.separator}ccache${if (OperatingSystem.current().windows) ".exe" else ""}").toFile()
                    if (file.exists()) {
                        println("Using ccache ${file.getAbsolutePath()}")
                        arguments += "-DANDROID_CCACHE=${file.getAbsolutePath()}"
                        return true
                    }
                }
            }
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    externalNativeBuild {
        cmake {
            version = '3.31.6+'
            path = 'jni/CMakeLists.txt'
        }
    }

    signingConfigs {
        diagnosticLab {
            storeFile file(System.getenv('FLEXYGRAM_DIAGNOSTIC_KEYSTORE') ?:
                    "${gradle.gradleUserHomeDir}/flexygram-diagnostic/debug.keystore")
            storePassword System.getenv('FLEXYGRAM_DIAGNOSTIC_STORE_PASSWORD')
            keyAlias 'flexygram-diagnostic'
            keyPassword System.getenv('FLEXYGRAM_DIAGNOSTIC_KEY_PASSWORD')
        }
    }

    productFlavors {
        diagnostic {
            dimension = 'environment'
            applicationId = variantPolicy.diagnostic.applicationId
            isDefault = true
            signingConfig = signingConfigs.diagnosticLab
        }
        production {
            dimension = 'environment'
            applicationId = variantPolicy.production.applicationId
            // No signingConfig: no production key and no debug/lab fallback.
        }
        if (betaDevelopmentEnabled) {
            betaDevelopment {
                dimension = 'environment'
                applicationId = betaPolicy.applicationId
                // No flavor signing assignment; Debug also has no signing config.
            }
        }
        if (realAlphaEnabled) {
            realAlpha {
                dimension = 'environment'
                applicationId = realAlphaPolicy.applicationId
                // Unsigned only. No Diagnostic or Android debug key fallback.
            }
        }
    }
    productFlavors.all { flavor ->
        def isBeta = flavor.name == 'betaDevelopment'
        def isRealAlpha = flavor.name == 'realAlpha'
        def policy = isRealAlpha ? realAlphaPolicy : (isBeta ? betaPolicy : variantPolicy[flavor.name])
        def scope = isRealAlpha ? realAlphaScope : (isBeta ? betaScope : policyDigest + ':' + flavor.name)
        flavor.buildConfigField 'boolean', 'ISOLATED_DIAGNOSTIC', policy.isolated.toString()
        flavor.buildConfigField 'String', 'FLEXYGRAM_VARIANT', groovy.json.JsonOutput.toJson(flavor.name)
        flavor.buildConfigField 'String', 'FLEXYGRAM_POLICY_SCOPE', groovy.json.JsonOutput.toJson(scope)
        policy.capabilities.each { name, enabled ->
            flavor.buildConfigField 'boolean', 'FLEXYGRAM_CAP_' + name.toUpperCase(java.util.Locale.ROOT), enabled.toString()
        }
        flavor.resValue 'string', 'flexygram_account_type', policy.applicationId
        flavor.resValue 'string', 'flexygram_storage_namespace', policy.applicationId
        flavor.externalNativeBuild.cmake.arguments '-DFLEXYGRAM_LOCAL_LOGIN_PAGES=' + (localLoginPagesEnabled && isRealAlpha ? 'ON' : 'OFF'),
                '-DFLEXYGRAM_FLAVOR=' + flavor.name,
                '-DFLEXYGRAM_POLICY_SCOPE=' + scope
    }

    buildTypes {
        debug {
            isDefault = true
            debuggable = true
            jniDebuggable = true
            multiDexEnabled = true
            signingConfig = null
        }

        if (startupDiagnosticsEnabled) {
            startupDiagnostic {
                initWith debug
                applicationIdSuffix = '.startupdiagnostic'
                matchingFallbacks = ['debug']
                signingConfig = null
            }
        }

        staging {
            debuggable = false
            jniDebuggable = false
            minifyEnabled = true
            shrinkResources = true
            multiDexEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release', 'staging', 'debug']
            signingConfig = null
        }

        release {
            debuggable = false
            jniDebuggable = false
            minifyEnabled = true
            shrinkResources = true
            multiDexEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release', 'staging', 'debug']
            signingConfig = null
        }
    }

    sourceSets.main.jniLibs.srcDirs = ['./jni/']
    if (localLoginPagesEnabled) {
        sourceSets.main.java.exclude('org/telegram/ui/LoginActivity.java')
        sourceSets.realAlpha.java.srcDirs += [
            rootProject.file('TMessagesProj_Modules/telegram-session-core/src/main/java'),
            rootProject.file('TMessagesProj_Modules/telegram-session-android/src/main/java'),
            rootProject.file('TMessagesProj_Modules/telegram-session-android/src/android/java'),
            rootProject.file('TMessagesProj_Modules/telegram-native-login/src/main/java'),
            rootProject.file('TMessagesProj_Modules/telegram-native-login/src/telegram/java'),
            rootProject.file('TMessagesProj_Modules/telegram-login-wiring/src/telegram/java'),
            rootProject.file('TMessagesProj_Modules/telegram-login-wiring/src/android/java'),
            rootProject.file('TMessagesProj_Modules/telegram-login-local-ui/src/main/java'),
            rootProject.file('build/generated/flexygram-local-login/java')
        ]
    }


    if (localLoginPagesEnabled) {
        def originalAlpha = file('src/realAlpha/java').canonicalFile
        sourceSets.realAlpha.java.setSrcDirs(sourceSets.realAlpha.java.srcDirs.findAll { it.canonicalFile != originalAlpha } + [
            rootProject.file('build/generated/flexygram-local-login/realAlpha'),
            file('src/realAlphaLocalLogin/java')
        ])
    }
    namespace = 'org.telegram.messenger'
}

androidComponents {
    beforeVariants(selector().all()) { builder ->
        def flavor = builder.productFlavors.find { it.first == 'environment' }?.second
        if (localLoginPagesEnabled && !(flavor == 'realAlpha' && builder.buildType == 'debug')) { builder.enable = false; return }
        // Reviewed isolated variants only. Production never reaches codegen, JNI or packaging.
        builder.enable = (flavor == 'diagnostic' && builder.buildType in ['debug', 'staging']) ||
                (betaDevelopmentEnabled && flavor == 'betaDevelopment' && builder.buildType == 'debug') ||
                (realAlphaEnabled && flavor == 'realAlpha' && builder.buildType == 'debug') ||
                (startupDiagnosticsEnabled && flavor == 'realAlpha' && builder.buildType == 'startupDiagnostic')
    }
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            String gramName = 'flexygram'
            String first = String.format('%s-v%s(%s)', gramName, verName, verCode)
            output.outputFileName.set(
                output.outputFileName.get()
                    .replace('TMessagesProj', first)
                    .replace('-release', '')
                    .replace('-staging', '')
            )
        }
    }
}

def chaquopyPythonVersion = '3.11'
def chaquopySourceDir = file('chaquopy')
def chaquopyRuntimeDir = layout.buildDirectory.dir('chaquopy/runtime').get().asFile
def chaquopyTarget = com.chaquo.python.internal.Common.PYTHON_VERSIONS.find { it.key.startsWith("${chaquopyPythonVersion}.") }
def chaquopyAbis = android.defaultConfig.ndk.abiFilters.sort(false)

def chaquopyRuntimeTasks = chaquopyAbis.collect { String abi ->
    tasks.register("buildChaquopyRuntime${abi.split(/[-_]/)*.capitalize().join()}", Exec) {
        def targetZip = configurations.detachedConfiguration(dependencies.create(
                "com.chaquo.python:target:${chaquopyTarget.key}-${chaquopyTarget.value}:${abi}@zip"))
        def outputDir = new File(chaquopyRuntimeDir, abi)
        inputs.files(fileTree(chaquopySourceDir) {
            include 'exteraless/build.sh'
            include 'product/runtime/CMakeLists.txt'
            include 'product/runtime/src/main/c/**'
            include 'product/runtime/src/main/python/**/*.pyx'
            include 'product/runtime/src/main/python/**/*.pxi'
            include 'product/runtime/src/main/python/**/*.pxd'
        }).withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.files(targetZip).withPathSensitivity(PathSensitivity.NAME_ONLY)
        outputs.dir(outputDir)
        commandLine 'bash', new File(chaquopySourceDir, 'exteraless/build.sh').path
        environment('ABI', abi)
        environment('OUT', outputDir.path)
        environment('WORKSPACE', layout.buildDirectory.dir('chaquopy/work').get().asFile.path)
        environment('PYTHON', chaquopyBuildPython ?: 'python3')
        environment('PYTHON_VERSION', chaquopyPythonVersion)
        doFirst {
            if (!new File(chaquopySourceDir, 'product/runtime').isDirectory()) {
                throw new GradleException('Chaquopy sources are missing, run: git submodule update --init TMessagesProj/chaquopy')
            }
            environment('NDK', androidComponents.sdkComponents.ndkDirectory.get().asFile.path)
            environment('PYTHON_TARGET_ZIP', targetZip.singleFile.path)
        }
    }
}

def overrideChaquopyRuntime = { task, String fileName, Closure<File> targetFor ->
    task.doLast {
        chaquopyAbis.each { String abi ->
            def target = targetFor(task.outputDir.get().asFile, abi)
            if (target.isDirectory()) {
                copy {
                    from new File(chaquopyRuntimeDir, "$abi/$fileName")
                    into target
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name ==~ /generate\w+PythonMiscAssets|generate\w+PythonJniLibs/) {
        task.inputs.files(chaquopyRuntimeTasks)
    }
}

gradle.taskGraph.whenReady { graph ->
    graph.allTasks.each { task ->
        if (task.name ==~ /generate\w+PythonMiscAssets/) {
            overrideChaquopyRuntime(task, 'chaquopy.so') { File out, String abi ->
                new File(out, "chaquopy/bootstrap-native/$abi/java")
            }
        } else if (task.name ==~ /generate\w+PythonJniLibs/) {
            overrideChaquopyRuntime(task, 'libchaquopy_java.so') { File out, String abi ->
                new File(out, abi)
            }
        }
    }
}

configurations.configureEach {
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    // official
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.neovisionaries:nv-websocket-client:2.14'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'androidx.sharetarget:sharetarget:1.2.0'
    implementation 'androidx.interpolator:interpolator:1.0.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
    // CameraX для круглых видеосообщений (app.exteraless.camera.CameraXSession).
    // Не ниже 1.6: в 1.5 нет SessionConfig, setPreviewStabilizationEnabled
    // и параллельной привязки двух камер. 1.6.2 чинит краш записи на Android 16.
    implementation 'androidx.camera:camera-core:1.6.2'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.alphacephei:vosk-android:0.3.75'
    compileOnly 'org.checkerframework:checker-qual:2.5.2'
    compileOnly 'org.checkerframework:checker-compat-qual:2.5.0'
    implementation 'com.google.firebase:firebase-messaging:25.1.2'
    implementation 'com.google.firebase:firebase-crashlytics:20.1.0'
    implementation 'com.google.android.gms:play-services-cast-framework:22.3.1'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.googlecode.mp4parser:isoparser:1.0.6'
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation ('com.google.guava:guava:33.6.0-android') {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'org.checkerframework', module: 'checker-compat-qual'
        exclude group: 'org.checkerframework', module: 'checker-qual'
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations'
        exclude group: 'org.codehaus.mojo', module: 'animal-sniffer-annotations'
    }
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
    implementation 'com.google.android.gms:play-services-mlkit-image-labeling:16.0.8'
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "io.noties.markwon:core:4.6.2"
