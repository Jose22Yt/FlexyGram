// No flavor may resolve the retired AAR, including disabled production configurations.
configurations.configureEach {
    exclude group: 'app.nekogram.translator', module: 'translator'
}

tasks.register('verifyDiagnosticTranslationClasspath') {
    def report = layout.buildDirectory.file('reports/translation-diagnostic-classpath.json')
    outputs.file(report)
    // Recheck the resolved graph rather than accepting a stale report.
    outputs.upToDateWhen { false }
    doLast {
        def names = ['diagnosticDebugCompileClasspath', 'diagnosticDebugRuntimeClasspath',
                     'diagnosticStagingCompileClasspath', 'diagnosticStagingRuntimeClasspath']
        def graphs = [:]
        names.each { name ->
            def configuration = configurations.getByName(name)
            def components = configuration.incoming.resolutionResult.allComponents
            if (components.any { it.moduleVersion?.group == 'app.nekogram.translator' && it.moduleVersion?.name == 'translator' }) {
                throw new GradleException('Legacy translation dependency is forbidden in Diagnostic')
            }
            // External artifacts only: legacy resolvedArtifacts is ambiguous for AGP project variants.
            def external = configuration.incoming.artifactView {
                componentFilter { id -> id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
            }.artifacts.artifacts
            graphs[name] = [
                components: components.collect { it.id.displayName }.sort(),
                externalArtifacts: external.collect { artifact ->
                    [id: artifact.id.componentIdentifier.displayName, file: artifact.file.absolutePath]
                }.sort { it.id }
            ]
        }
        def target = report.get().asFile
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(graphs))
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyDiagnosticTranslationClasspath' }

// An explicit failed task, never a silent successful no-op for disabled production builds.
tasks.register('verifyProductionReadiness') { doLast { rejectProduction.call() } }
['', 'Debug', 'Staging', 'Release'].each { suffix ->
    ['assemble', 'bundle'].each { operation ->
        tasks.register(operation + 'Production' + suffix) { dependsOn 'verifyProductionReadiness' }
    }
}

// Exact, generated Java overlay is selected ONLY for the explicit startup diagnostic task.
// Debug realAlpha and every existing variant still compile their original source bytes.
if (startupDiagnosticsEnabled) {
    def startupSources = layout.buildDirectory.dir('generated/flexygramStartup/java')
    def prepareStartupSources = tasks.register('prepareRealAlphaStartupSources', Exec) {
        inputs.files(rootProject.file('tools/real_alpha/startup-overlays.json'),
                rootProject.file('tools/real_alpha/prepare_startup_sources.py'))
        def rows = new groovy.json.JsonSlurper().parse(rootProject.file('tools/real_alpha/startup-overlays.json')).files
        inputs.files(rows.collect { rootProject.file(it.source) })
        outputs.dir(startupSources)
        commandLine chaquopyBuildPython ?: 'python3', rootProject.file('tools/real_alpha/prepare_startup_sources.py'),
                '--output', startupSources.get().asFile.absolutePath
    }
    androidComponents.onVariants(androidComponents.selector().withBuildType('startupDiagnostic')) { variant ->
        if (variant.name == 'realAlphaStartupDiagnostic') {
            variant.sources.java.addStaticSourceDirectory(startupSources.get().asFile.absolutePath)
        }
    }
    tasks.configureEach { task ->
        if (task.name == 'compileRealAlphaStartupDiagnosticKotlin') {
            task.dependsOn(prepareStartupSources)
        }
    }
    tasks.withType(JavaCompile).configureEach { task ->
        if (task.name == 'compileRealAlphaStartupDiagnosticJavaWithJavac') {
            def rows = new groovy.json.JsonSlurper().parse(rootProject.file('tools/real_alpha/startup-overlays.json')).files
            def originals = rows.collect { rootProject.file(it.source).canonicalPath } as Set
            task.dependsOn(prepareStartupSources)
            task.exclude { element -> originals.contains(element.file.canonicalPath) }
        }
    }
}

// P0.4c: pip resolves exclusively the verified local wheelhouse, including transitives.
def prepareLockedPython = tasks.register('prepareLockedPython', Exec) {
    inputs.files(file('python/wheels.lock.json'), rootProject.file('tools/native_compatibility/wheelhouse.py'))
    def requested = System.getenv('NATIVE_TARGET') ?: ''
    def lockedAbis = requested in ['', 'universal'] ? ['arm64-v8a', 'x86_64'] : [requested == 'SKIP' ? 'arm64-v8a' : requested]
    inputs.property('targetAbis', lockedAbis)
    outputs.dir(file('build/locked-wheelhouse'))
    commandLine(([chaquopyBuildPython ?: 'python3', rootProject.file('tools/native_compatibility/wheelhouse.py').absolutePath,
        '--lock', file('python/wheels.lock.json').absolutePath,
        '--output', file('build/locked-wheelhouse').absolutePath] +
        lockedAbis.collectMany { ['--abi', it] } +
        (gradle.startParameter.offline ? ['--offline'] : [])))
}
tasks.configureEach { task ->
    if (task.name.startsWith('install') && task.name.endsWith('PythonRequirements')) {
        task.dependsOn(prepareLockedPython)
    }
}

// Independent, opt-in source overlay; does not participate in the default build.
apply from: rootProject.file("gradle/real-alpha-offline-ui.gradle")
 
// Combined lab inputs are verified before Java/D8 whenever both opt-ins are set.
// This never runs for the stable APK, another flavor, or a one-feature build.
if (localLoginPagesEnabled && providers.gradleProperty('flexygramOfflineDialogsUi').orNull == 'true') {
    def verifyCombinedRealAlphaSources = tasks.register('verifyCombinedRealAlphaSources', Exec) {
        workingDir rootProject.projectDir
        commandLine chaquopyBuildPython ?: 'python3',
                rootProject.file('tools/real_alpha_integration/check_combined.py').absolutePath, '--check'
        outputs.upToDateWhen { false }
    }
    tasks.named('preBuild').configure { dependsOn verifyCombinedRealAlphaSources }
}

