plugins { id 'com.android.test' }
def nativeTarget = project.findProperty('flexyStartupOptimization') == 'true'
if (project.findProperty('flexyPerformanceBuild') != 'true') {
    throw new GradleException('Device benchmarks require a non-debuggable performance build.')
}
android {
    namespace 'com.flexygram.performance'
    compileSdk = 37
    targetProjectPath = ':TMessagesProj'
    defaultConfig {
        minSdk = 33
        targetSdk = 37
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        testInstrumentationRunnerArguments 'flexy.targetPackage': (nativeTarget ? 'com.flexygram.messenger.nativebaseline' : 'io.github.jose22yt.flexygram.alpha')
    }
    buildTypes {
        connectedAlpha {
            initWith debug
            matchingFallbacks = ['debug']
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    experimentalProperties['android.experimental.self-instrumenting'] = true
}
androidComponents {
    beforeVariants(selector().all()) { builder -> builder.enable = builder.buildType == (nativeTarget ? 'debug' : 'connectedAlpha') }
}
dependencies {
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.5.0'
    implementation 'androidx.test:runner:1.7.0'
    implementation 'androidx.test.ext:junit:1.3.0'
    implementation 'androidx.test.uiautomator:uiautomator:2.4.0'
}
