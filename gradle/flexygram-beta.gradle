// Pre-build checks only; never create or substitute a release identity.
def betaPrivateValue = { String name ->
    def values = new Properties()
    def encoded = System.getenv('LOCAL_PROPERTIES')
    if (encoded) {
        values.load(new ByteArrayInputStream(Base64.decoder.decode(encoded)))
    } else {
        def local = rootProject.file('local.properties')
        if (local.exists()) local.withInputStream { values.load(it) }
    }
    values.getProperty(name) ?: System.getenv(name)
}
def validateBeta = tasks.register('validateFlexyGramBetaConfiguration') {
    doLast {
        if (APP_PACKAGE != 'com.flexygram.messenger') {
            throw new GradleException('Official Beta requires com.flexygram.messenger.')
        }
        if ((System.getenv('NATIVE_TARGET') ?: '') != 'arm64-v8a') {
            throw new GradleException('Beta requires the complete ARM64 native build: NATIVE_TARGET=arm64-v8a.')
        }
        def id = betaPrivateValue('TELEGRAM_APP_ID')
        def hash = betaPrivateValue('TELEGRAM_APP_HASH')
        if (!(id ==~ /[1-9][0-9]{0,9}/) || id.toLong() > Integer.MAX_VALUE || id in ['4', '6', '2040'] || !(hash ==~ /[a-fA-F0-9]{32}/)) {
            throw new GradleException('Configure authorized Telegram credentials privately.')
        }
        def names = ['FLEXYGRAM_RELEASE_KEYSTORE', 'FLEXYGRAM_RELEASE_STORE_PASSWORD',
                     'FLEXYGRAM_RELEASE_KEY_ALIAS', 'FLEXYGRAM_RELEASE_KEY_PASSWORD',
                     'FLEXYGRAM_RELEASE_CERT_SHA256']
        names.each { name ->
            if (!betaPrivateValue(name)) throw new GradleException('Missing Beta signing input: ' + name)
        }
        def keyFile = rootProject.file(betaPrivateValue('FLEXYGRAM_RELEASE_KEYSTORE')).canonicalFile
        // Owner custody is external to this working tree, including CI temporary files.
        if (!keyFile.isFile() || keyFile.toPath().startsWith(rootProject.projectDir.canonicalFile.toPath())) {
            throw new GradleException('Beta keystore must exist outside the repository.')
        }
        def store = java.security.KeyStore.getInstance('PKCS12')
        def storePass = betaPrivateValue('FLEXYGRAM_RELEASE_STORE_PASSWORD').toCharArray()
        def keyPass = betaPrivateValue('FLEXYGRAM_RELEASE_KEY_PASSWORD').toCharArray()
        try {
            keyFile.withInputStream { store.load(it, storePass) }
            def alias = betaPrivateValue('FLEXYGRAM_RELEASE_KEY_ALIAS')
            if (!store.isKeyEntry(alias) || !(store.getKey(alias, keyPass) instanceof java.security.PrivateKey)) {
                throw new GradleException('Beta alias must contain an accessible private signing key.')
            }
            def cert = store.getCertificate(alias)
            cert.checkValidity()
            def fingerprint = java.security.MessageDigest.getInstance('SHA-256').digest(cert.encoded).encodeHex().toString()
            def expected = betaPrivateValue('FLEXYGRAM_RELEASE_CERT_SHA256').replace(':', '').toLowerCase(java.util.Locale.ROOT)
            if (!(expected ==~ /[a-f0-9]{64}/) || fingerprint != expected) {
                throw new GradleException('Beta certificate differs from the owner-pinned SHA-256.')
            }
            if (fingerprint == 'c8f04cad685ca5757d35b25ea4b0b4613c7399909948d821e6ada61f9fb12b2c' || cert.subjectX500Principal.name.contains('CN=Android Debug')) {
                throw new GradleException('Beta requires a new exclusive release certificate, independent of Alpha/debug.')
            }
        } finally {
            java.util.Arrays.fill(storePass, (char) 0)
            java.util.Arrays.fill(keyPass, (char) 0)
        }
        def google = file('src/beta/google-services.json')
        if (!google.isFile()) throw new GradleException('Supply owner Firebase configuration in src/beta/google-services.json.')
        def config = new groovy.json.JsonSlurper().parse(google)
        if (!config.client.any { it.client_info?.android_client_info?.package_name == APP_PACKAGE }) {
            throw new GradleException('Firebase must register the official Beta package.')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'preBetaBuild') task.dependsOn(validateBeta)
}
