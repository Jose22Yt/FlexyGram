name: Connected Alpha ARM64 build

on:
  push:
    branches:
      - alpha/connected-exteraless-baseline
      - support/connected-alpha-ci-20261022
    paths:
      - '.github/workflows/connected-alpha-arm64.yml'
      - 'TMessagesProj/**'
      - 'TMessagesProj_Modules/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle'
      - 'settings.gradle'
      - 'tools/connected_alpha/**'

permissions:
  contents: read

concurrency:
  group: alpha-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credentials-present:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        name: Check secret presence without logging values
        shell: bash
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          ALPHA_STORE_PASSWORD: ${{ secrets.ALPHA_STORE_PASSWORD }}
          ALPHA_KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          ALPHA_KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
          ALPHA_FIREBASE_JSON_B64: ${{ secrets.ALPHA_FIREBASE_JSON_B64 }}
          ALPHA_KEYSTORE_B64: ${{ secrets.ALPHA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          ready=true
          for name in TELEGRAM_APP_ID TELEGRAM_APP_HASH ALPHA_STORE_PASSWORD ALPHA_KEY_ALIAS ALPHA_KEY_PASSWORD ALPHA_FIREBASE_JSON_B64 ALPHA_KEYSTORE_B64; do
            if [[ -z "${!name}" ]]; then ready=false; fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" == true ]]; then
            echo "Private inputs present; no values logged."
          else
            echo "Private inputs incomplete; skipping native build."
          fi

  build-arm64:
    needs: credentials-present
    if: needs.credentials-present.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NATIVE_TARGET: arm64-v8a
      TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
      TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
      ALPHA_STORE_PASSWORD: ${{ secrets.ALPHA_STORE_PASSWORD }}
      ALPHA_KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
      ALPHA_KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
      ALPHA_FIREBASE_JSON_B64: ${{ secrets.ALPHA_FIREBASE_JSON_B64 }}
      ALPHA_KEYSTORE_B64: ${{ secrets.ALPHA_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            build-tools;36.0.0
            platforms;android-37.0
            ndk;27.2.12479018
            cmake;3.31.6
      - name: Install native build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nasm
      - name: Check workspace disk before JNI build
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          free_kb=$(df -Pk . | awk 'NR==2 {print $4}')
          if (( free_kb < 8 * 1024 * 1024 )); then
            echo "::error::Less than 8 GiB free; JNI build not attempted."
            exit 1
          fi
      - name: Restore private inputs in ignored locations
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          echo "CHAQUOPY_BUILD_PYTHON=$(command -v python3.11)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          for name, target in (
              ('ALPHA_FIREBASE_JSON_B64', 'TMessagesProj/src/connectedAlpha/google-services.json'),
              ('ALPHA_KEYSTORE_B64', 'config/connected-alpha-test.keystore'),
          ):
              data = base64.b64decode(os.environ[name], validate=True)
              if not data:
                  raise ValueError(f'{name}: empty input')
              if name == 'ALPHA_FIREBASE_JSON_B64':
                  clients = json.loads(data).get('client', [])
                  if not any(c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'io.github.jose22yt.flexygram.alpha' for c in clients):
                      raise ValueError('Firebase Android package does not match Connected Alpha')
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              path.chmod(0o600)
          print('Private input files staged. No contents logged.')
          PY
      - name: Run source and ELF verifier tests
        run: |
          python3 tools/connected_alpha/check_source.py >/dev/null
          python3 -m unittest discover -s tools/connected_alpha -p 'test_*.py' -v
      - name: Build Connected Alpha with original native code
        run: ./gradlew :TMessagesProj:assembleConnectedAlpha --no-daemon --console=plain
      - name: Verify APK with authorized certificate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find TMessagesProj/build/outputs/apk/connectedAlpha -type f -name '*.apk')
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Connected Alpha APK."
            exit 1
          fi
          fingerprint=$(keytool -list -v -keystore config/connected-alpha-test.keystore -alias "$ALPHA_KEY_ALIAS" -storepass:env ALPHA_STORE_PASSWORD | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)
          test -n "$fingerprint"
          python3 tools/connected_alpha/verify_apk.py "${packages[0]}" --build-tools "$ANDROID_HOME/build-tools/36.0.0" --certificate-sha256 "$fingerprint" > connected-alpha-verification.json
          python3 - <<'PY'
          import json
          data = json.load(open('connected-alpha-verification.json', encoding='utf-8'))
          print('APK SHA-256:', data['sha256'])
          print('ELF verified:', data['elf_count'])
          print('Android launch and login remain NOT TESTED.')
          PY
      # In a public repo, action artifacts can be accessed by other users.
      # Upload requires a SEPARATE explicit repository variable opt-in.
      - name: Public APK artifact — explicit opt-in only
        if: vars.ALPHA_PUBLIC_APK_ARTIFACT == 'enabled'
        uses: actions/upload-artifact@v4
        with:
          name: FlexyGram-ConnectedAlpha-ARM64
          path: |
            TMessagesProj/build/outputs/apk/connectedAlpha/*.apk
            connected-alpha-verification.json
          retention-days: 1
          if-no-files-found: error
      - name: Wipe private build inputs
        if: always()
        shell: bash
        run: |
          rm -f TMessagesProj/src/connectedAlpha/google-services.json config/connected-alpha-test.keystore
