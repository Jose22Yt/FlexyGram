name: Native Instant Touch contracts
on:
  pull_request:
    paths:
      - 'TMessagesProj/src/main/java/app/flexygram/navigation/**'
      - 'TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ActionBarLayout.java'
      - 'tools/connected_alpha/native_touch/**'
      - '.github/workflows/native-instant-touch.yml'
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and exercise the always-on policy
        run: |
          mkdir -p /tmp/native-touch
          javac -encoding UTF-8 -d /tmp/native-touch \
            TMessagesProj/src/main/java/app/flexygram/navigation/NativeInstantTouchPolicy.java \
            tools/connected_alpha/native_touch/NativeInstantTouchPolicyTest.java
          java -cp /tmp/native-touch NativeInstantTouchPolicyTest
      - name: Check no settings or animation engine imports
        run: python3 tools/connected_alpha/native_touch/check_wiring.py
      - uses: android-actions/setup-android@v3
      - name: Compile production hit test and check Android view clipping
        run: python3 tools/connected_alpha/native_touch/run.py --sdk-root "$ANDROID_HOME"
