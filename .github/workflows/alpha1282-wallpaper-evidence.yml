name: Alpha1282 native wallpaper synthetic evidence
on:
  push:
    branches: [validation/alpha1282-wallpaper-render]
permissions:
  contents: read
jobs:
  graphics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 81759d45789def9967d9c1cfc881576b9bf3009c
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 platforms;android-37.0'
      - run: python3 tools/connected_alpha/bubble_visual/run.py --sdk-root "$ANDROID_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: Alpha1282-native-wallpaper-synthetic-evidence
          path: |
            build/connected-alpha-bubble-visual/android-native-wallpaper-blur.png
            build/connected-alpha-bubble-visual/target/surefire-reports/*.xml
          if-no-files-found: error
          retention-days: 7
