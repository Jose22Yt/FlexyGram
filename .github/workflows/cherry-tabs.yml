name: FlexyGram interactive bottom tabs
on:
  pull_request:
    paths:
      - 'TMessagesProj/src/main/java/app/flexygram/navigation/**'
      - 'TMessagesProj/src/main/java/org/telegram/ui/MainTabsActivity.java'
      - 'TMessagesProj/src/main/java/org/telegram/ui/Components/glass/GlassTabView.java'
      - 'tools/cherry_tabs/**'
      - '.github/workflows/cherry-tabs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bottom-tabs-contract:
    name: Interactive tabs host/source verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Native integration source contract
        run: python3 tools/cherry_tabs/check.py
      - name: Test destination sanitization and overflow on JVM
        run: |
          mkdir -p /tmp/flexy-bottom-tabs-contract
          javac -encoding UTF-8 -d /tmp/flexy-bottom-tabs-contract \
            TMessagesProj/src/main/java/app/flexygram/navigation/LiquidNavigationDestinations.java \
            tools/cherry_tabs/BottomTabsDestinationsTest.java
          java -cp /tmp/flexy-bottom-tabs-contract BottomTabsDestinationsTest
