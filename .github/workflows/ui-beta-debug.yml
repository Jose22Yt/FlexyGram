name: FlexyGram UI beta debug ARM64
run-name: UI beta debug ARM64 · ${{ github.sha }}

on:
  push:
    branches: [codex/flexygram-beta-glass]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flexygram-ui-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Jose22Yt/FlexyGram' && github.ref == 'refs/heads/codex/flexygram-beta-glass'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NATIVE_TARGET: arm64-v8a
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
      TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
      TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
      ALPHA_FIREBASE_JSON_B64: ${{ secrets.FLEXYGRAM_BETA_FIREBASE_JSON_B64 || secrets.ALPHA_FIREBASE_JSON_B64 }}
    steps:
      - name: Check out this branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-37.0 ndk;27.2.12479018 cmake;3.31.6'
      - name: Prepare build tools
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # The hosted mirror list can retain an unreachable Azure endpoint for every package.
          # Keep signed Ubuntu repositories and HTTPS; no trust checks are bypassed.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          flexy_apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any)
          sudo apt-get "${flexy_apt_options[@]}" update -qq
          sudo apt-get "${flexy_apt_options[@]}" install -y --no-install-recommends nasm ninja-build patchelf autoconf automake libtool pkg-config maven
          python -m pip install pytest==9.2.0 PyYAML==6.0.3 tree-sitter==0.26.0 tree-sitter-java==0.23.5
          git fetch --no-recurse-submodules --no-tags --depth=1 origin \
            4679f74ebd312acc4968dd2e044a6c6b7478445a \
            bf96667efac14d0cbbf6677471890a366c3ef3c0 \
            3c7a20a229d425c8f3b5ea1740ccb6d8b3361fea \
            abf93053f9f98bae95b88f070f3e964c8b3bb311 \
            1c323bf54c401204b69f1a204cb5e817d7584d17 \
            751c926d91acd536d96b427af5f34f2fe6bedbc4
          printf 'toolchainVersion=21\ntoolchainVendor=ADOPTIUM\n' > gradle/gradle-daemon-jvm.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          if [ -n "${TELEGRAM_APP_ID:-}" ]; then
            printf 'TELEGRAM_APP_ID=%s\nTELEGRAM_APP_HASH=%s\n' "$TELEGRAM_APP_ID" "$TELEGRAM_APP_HASH" >> local.properties
          fi
          echo "CHAQUOPY_BUILD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "CMAKE=$ANDROID_HOME/cmake/3.31.6/bin/cmake" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"
          cat > "$RUNNER_TEMP/flexy-native-pools.gradle" <<'GRADLE'
          allprojects {
              plugins.withId('com.android.application') {
                  android.defaultConfig.externalNativeBuild.cmake.arguments(
                      '-DCMAKE_JOB_POOLS=flexy_compile=2;flexy_link=1',
                      '-DCMAKE_JOB_POOL_COMPILE=flexy_compile',
                      '-DCMAKE_JOB_POOL_LINK=flexy_link'
                  )
              }
          }
          GRADLE
      - name: Run Python and JVM policy tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/ui-beta
          python -m pytest tests/ -q -p no:cacheprovider --junitxml=build/reports/ui-beta/tests.xml
          python -m pytest tools/connected_alpha/test_flexystudio.py -q -p no:cacheprovider
          python tools/connected_alpha/check_studio_types.py
          python tools/connected_alpha/check_studio_client.py
          python tools/connected_alpha/header_touch/run.py --sdk-root "$ANDROID_HOME" --output-dir build/reports/ui-beta/header-touch
          python tools/connected_alpha/music_visual/run.py --sdk-root "$ANDROID_HOME" --output-dir build/reports/ui-beta/music-visual
          python tools/connected_alpha/lyrics_runtime/run.py --sdk-root "$ANDROID_HOME" --output-dir build/reports/ui-beta/lyrics-runtime
          python tools/connected_alpha/lyrics_ui/run.py --sdk-root "$ANDROID_HOME" --output-dir build/reports/ui-beta/lyrics-ui
          python tools/connected_alpha/delete_motion/run.py --sdk-root "$ANDROID_HOME" --output-dir build/reports/ui-beta/delete-motion
      - name: Rebuild the dependency wheels required by the official beta source
        shell: bash
        run: |
          set -euo pipefail
          {
            python -m venv "$RUNNER_TEMP/beta-wheel-tools"
            "$RUNNER_TEMP/beta-wheel-tools/bin/python" -m pip install -r TMessagesProj/chaquopy/server/pypi/requirements.txt
            "$RUNNER_TEMP/beta-wheel-tools/bin/python" tools/connected_alpha/rebuild_python_wheels.py \
              --chaquopy TMessagesProj/chaquopy --output "$RUNNER_TEMP/beta-wheelhouse"
          } 2>&1 | tee build/reports/ui-beta/wheels.log
          echo "ALPHA_WHEELHOUSE=$RUNNER_TEMP/beta-wheelhouse" >> "$GITHUB_ENV"
      - name: Assemble debug APK with native libraries and Python
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TMessagesProj/src/debug
          python3 -c '
          import os, base64, json
          b64 = os.environ.get("ALPHA_FIREBASE_JSON_B64")
          out = "TMessagesProj/src/debug/google-services.json"
          data = None
          if b64:
              try:
                  parsed = json.loads(base64.b64decode(b64))
                  has_client = any(
                      c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.flexygram.messenger"
                      for c in parsed.get("client", [])
                  )
                  if has_client:
                      data = parsed
                  else:
                      print("REJECTED: Firebase configuration contains no client for com.flexygram.messenger; discarding incompatible secret.")
                      data = None
              except Exception as e:
                  print("Could not parse Firebase secret:", e)
                  data = None
          if not data:
              data = {
                  "project_info": {
                      "project_number": "100000000000",
                      "project_id": "flexygram-debug",
                      "storage_bucket": "flexygram-debug.appspot.com"
                  },
                  "client": [{
                      "client_info": {
                          "mobilesdk_app_id": "1:100000000000:android:0000000000000000000000",
                          "android_client_info": {
                              "package_name": "com.flexygram.messenger"
                          }
                      },
                      "oauth_client": [],
                      "api_key": [{"current_key": "AIzaSyDebugMockKeyForLocalAssembly0000"}],
                      "services": {"appinvite_service": {"other_platform_oauth_client": []}}
                  }],
                  "configuration_version": "1"
              }
          with open(out, "w") as f:
              json.dump(data, f, indent=2)
          '
          export GRADLE_OPTS="-Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.wrapper.networkTimeout=120000"
          ./gradlew --no-daemon --max-workers=2 --console=plain \
            --init-script "$RUNNER_TEMP/flexy-native-pools.gradle" \
            -PflexyPerformanceBuild=true :TMessagesProj:assembleDebug 2>&1 | tee build/reports/ui-beta/assemble.log
      - name: Verify APK signature and native ABI
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find TMessagesProj/build/outputs/apk/debug -type f -name '*.apk')
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            unzip -Z1 "$apk" > build/reports/ui-beta/apk-entries.txt
            grep -Eq '^lib/arm64-v8a/libtmessages.*\.so$' build/reports/ui-beta/apk-entries.txt
            grep -Eq '^lib/arm64-v8a/libchaquopy_java\.so$' build/reports/ui-beta/apk-entries.txt
            sha256sum "$apk" >> build/reports/ui-beta/SHA256SUMS
            python tools/apk_size_report.py "$apk" >> build/reports/ui-beta/apk-size.jsonl
          done
      - name: Annotate build failures
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          reports = [Path('build/reports/ui-beta/wheels.log'), Path('build/reports/ui-beta/assemble.log')]
          for report in reports:
              if not report.is_file():
                  continue
              lines = report.read_text(errors='replace').splitlines()
              diagnostics = []
              for index, line in enumerate(lines):
                  if re.search(r'error:|^e:|^> |^Execution failed for task|^Caused by:|ERROR:|HTTPError:|URLError:|ValueError:|CalledProcessError:|TimeoutError:', line):
                      context = [line]
                      for following in lines[index + 1:index + 5]:
                          if following.strip().startswith(('symbol:', 'location:', 'required:', 'found:', 'reason:')):
                              context.append(following)
                      diagnostics.append('\n'.join(context))
              for message in list(dict.fromkeys(diagnostics))[-15:]:
                  for name in ('TELEGRAM_APP_ID', 'TELEGRAM_APP_HASH', 'ALPHA_FIREBASE_JSON_B64'):
                      value = os.environ.get(name)
                      if value:
                          message = message.replace(value, '***')
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=FlexyGram build diagnostic::{message}')
          PY
      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "### FlexyGram UI beta debug ARM64"
            echo "Source: $GITHUB_SHA"
            grep '^APP_PACKAGE=' gradle.properties
            echo 'Functional base: official beta 932c9a6db84fab52ab167d4c8ee70957b3e57223'
            if test -f build/reports/ui-beta/assemble.log; then
              echo '```text'
              grep -E -A 5 'error:|^e:|FAILED|What went wrong|Could not resolve' build/reports/ui-beta/assemble.log | tail -n 100 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flexygram-ui-beta-reports-${{ github.sha }}
          path: |
            build/reports/ui-beta/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 7
      - name: Save debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flexygram-ui-beta-debug-arm64-${{ github.sha }}
          path: TMessagesProj/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
