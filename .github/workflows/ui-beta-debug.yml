name: FlexyGram UI beta debug ARM64
run-name: UI beta debug ARM64 · ${{ github.sha }}

on:
  push:
    branches: [codex/flexygram-beta-glass]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flexygram-ui-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Jose22Yt/FlexyGram' && github.ref == 'refs/heads/codex/flexygram-beta-glass'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NATIVE_TARGET: arm64-v8a
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
    steps:
      - name: Check out this branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-37.0 ndk;27.2.12479018 cmake;3.31.6'
      - name: Prepare build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nasm ninja-build patchelf autoconf automake libtool pkg-config
          python -m pip install pytest==9.2.0 PyYAML==6.0.3 tree-sitter==0.26.0 tree-sitter-java==0.23.5
          printf 'toolchainVersion=21\ntoolchainVendor=ADOPTIUM\n' > gradle/gradle-daemon-jvm.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          echo "CHAQUOPY_BUILD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "CMAKE=$ANDROID_HOME/cmake/3.31.6/bin/cmake" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"
          cat > "$RUNNER_TEMP/flexy-native-pools.gradle" <<'GRADLE'
          allprojects {
              plugins.withId('com.android.application') {
                  android.defaultConfig.externalNativeBuild.cmake.arguments(
                      '-DCMAKE_JOB_POOLS=flexy_compile=2;flexy_link=1',
                      '-DCMAKE_JOB_POOL_COMPILE=flexy_compile',
                      '-DCMAKE_JOB_POOL_LINK=flexy_link'
                  )
              }
          }
          GRADLE
      - name: Run Python and JVM policy tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/ui-beta
          python -m pytest tests/ -q -p no:cacheprovider --junitxml=build/reports/ui-beta/tests.xml
      - name: Assemble debug APK with native libraries and Python
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --console=plain \
            --init-script "$RUNNER_TEMP/flexy-native-pools.gradle" \
            :TMessagesProj:assembleDebug 2>&1 | tee build/reports/ui-beta/assemble.log
      - name: Verify APK signature and native ABI
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find TMessagesProj/build/outputs/apk/debug -type f -name '*.apk')
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            unzip -Z1 "$apk" > build/reports/ui-beta/apk-entries.txt
            grep -Eq '^lib/arm64-v8a/libtmessages.*\.so$' build/reports/ui-beta/apk-entries.txt
            grep -Eq '^lib/arm64-v8a/libchaquopy_java\.so$' build/reports/ui-beta/apk-entries.txt
            sha256sum "$apk" >> build/reports/ui-beta/SHA256SUMS
          done
      - name: Save build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flexygram-ui-beta-reports-${{ github.sha }}
          path: |
            build/reports/ui-beta/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 7
      - name: Save debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flexygram-ui-beta-debug-arm64-${{ github.sha }}
          path: TMessagesProj/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
