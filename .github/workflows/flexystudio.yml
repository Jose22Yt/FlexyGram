name: FlexyStudio native checks
on:
  push:
    branches: [feat/flexystudio-native-presets]
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
concurrency:
  group: flexystudio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  studio:
    if: github.event_name == 'push' || github.head_ref == 'feat/flexystudio-native-presets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 -m pip install -r tools/connected_alpha/requirements-ci.txt
      - run: git submodule update --init --depth 1 TMessagesProj_Modules/media TMessagesProj/chaquopy
      - run: python3 tools/connected_alpha/run_checks.py
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 platforms;android-37.0'
      - run: python3 tools/connected_alpha/check_resources.py --sdk-root "$ANDROID_HOME"
      - name: Native Studio and integrated renderer regressions (explicit dependency doubles)
        run: |
          for probe in studio_native bubble_visual matte_visual composer_visual home_visual login_visual music_visual header_visual preview_visual performance/native; do
            python3 "tools/connected_alpha/$probe/run.py" --sdk-root "$ANDROID_HOME"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: FlexyStudio-Isolated-Android-Evidence
          path: |
            build/connected-alpha-studio-native/studio-*-isolated.png
            build/connected-alpha-studio-native/target/surefire-reports/*.xml
          retention-days: 7
          if-no-files-found: error
