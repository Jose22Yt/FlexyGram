name: Beta private infrastructure tests (no secrets)
on:
  pull_request:
    paths:
      - '.github/beta/**'
      - '.github/workflows/beta-private*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 -m unittest discover -s .github/beta -p 'test_*.py' -v
      - name: Validate GitHub Actions schema and contexts with pinned actionlint
        run: |
          python3 - <<'PYLINT'
          import hashlib, io, pathlib, subprocess, tarfile, tempfile, urllib.request
          url = 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8':
              raise SystemExit('Unexpected actionlint checksum')
          with tempfile.TemporaryDirectory() as directory:
              executable = pathlib.Path(directory)/'actionlint'
              with tarfile.open(fileobj=io.BytesIO(data)) as archive:
                  executable.write_bytes(archive.extractfile('actionlint').read())
              executable.chmod(0o700)
              subprocess.run([str(executable), '-shellcheck=', '.github/workflows/beta-private.yml',
                              '.github/workflows/beta-private-tests.yml'], check=True)
          PYLINT
