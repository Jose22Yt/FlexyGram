name: Beta private infrastructure tests (no secrets)
on:
  pull_request:
    paths:
      - '.github/beta/**'
      - '.github/workflows/beta-private*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 -m unittest discover -s .github/beta -p 'test_*.py' -v
