name: Bubble Glass rendering contracts
on:
  pull_request:
    paths:
      - 'TMessagesProj/src/main/java/app/flexygram/bubbles/**'
      - 'TMessagesProj/src/main/java/org/telegram/ui/ActionBar/MessageDrawable.java'
      - 'TMessagesProj/src/main/res/values*/flexy_bubble_glass.xml'
      - 'tools/connected_alpha/matte_bubbles/**'
      - '.github/workflows/signature-matte-bubbles.yml'
  workflow_dispatch:
jobs:
  isolated-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Glass alpha/transition math checks
        run: |
          mkdir -p /tmp/flexy-glass-contract
          javac -encoding UTF-8 -d /tmp/flexy-glass-contract \
            TMessagesProj/src/main/java/app/flexygram/bubbles/BubbleGlassPolicy.java \
            tools/connected_alpha/matte_bubbles/GlassPolicyContractTest.java
          java -cp /tmp/flexy-glass-contract GlassPolicyContractTest
      - name: Settings/render/preview/source assertions
        run: |
          python3 tools/connected_alpha/matte_bubbles/test_matte_integration.py
          python3 tools/connected_alpha/bubble_glass/check_glass_source.py
