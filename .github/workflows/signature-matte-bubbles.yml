name: Original bubble blur restoration contracts
on:
  pull_request:
    paths:
      - 'TMessagesProj/src/main/java/app/flexygram/bubbles/**'
      - 'TMessagesProj/src/main/java/org/telegram/ui/ActionBar/MessageDrawable.java'
      - 'TMessagesProj/src/main/res/values*/flexy_bubble_glass.xml'
      - 'tools/connected_alpha/matte_bubbles/**'
      - '.github/workflows/signature-matte-bubbles.yml'
  workflow_dispatch:
jobs:
  isolated-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preserve Matte utility used by other surfaces
        run: |
          mkdir -p /tmp/flexy-blur-contract
          javac -encoding UTF-8 -d /tmp/flexy-blur-contract \
            TMessagesProj/src/main/java/app/flexygram/bubbles/SignatureMatteFinish.java \
            tools/connected_alpha/matte_bubbles/MatteFinishContractTest.java
          java -cp /tmp/flexy-blur-contract MatteFinishContractTest
      - name: Current blur, conversion-removal and unchanged native-surface contracts
        run: python3 -m unittest discover -s tools/connected_alpha -p test_reconstruction1285.py -v
