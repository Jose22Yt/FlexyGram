name: Universal Performance3 source and native checks
on:
  push:
    branches: [integration/connected-alpha-universal-performance3]
permissions:
  contents: read
concurrency:
  group: universal3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 -m pip install -r tools/connected_alpha/requirements-ci.txt
      - run: git submodule update --init --depth 1 TMessagesProj_Modules/media TMessagesProj/chaquopy
      - run: python3 tools/connected_alpha/run_checks.py
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 platforms;android-37.0'
      - run: python3 tools/connected_alpha/check_resources.py --sdk-root "$ANDROID_HOME"
      - name: Native candidate, Motion patch and integrated renderer regressions
        run: |
          for probe in performance/native3 performance/native bubble_visual matte_visual composer_visual home_visual login_visual music_visual header_visual preview_visual studio_native; do
            python3 "tools/connected_alpha/$probe/run.py" --sdk-root "$ANDROID_HOME"
          done
      - name: Check entire candidate whitespace
        run: git diff --check 8c47e5532a600f9a8b4ccbfdac5090d09a1075a0
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalPerformance3-Isolated-Evidence
          path: |
            build/connected-alpha-performance3-native/native3-*.json
            build/connected-alpha-performance3-native/native3-*.png
            build/connected-alpha-performance3-native/target/surefire-reports/*.xml
          retention-days: 7
          if-no-files-found: error
